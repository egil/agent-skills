name: Validate delivery package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Codex delivery bundle
        shell: pwsh
        run: ./scripts/validate-delivery-package.ps1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test observability helpers
        shell: bash
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_CLI_HOME: /tmp/dotnet
        run: dotnet test tests/AgentSkills.Tests/AgentSkills.Tests.csproj -v minimal -p:TreatWarningsAsErrors=true
